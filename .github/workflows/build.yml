name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
          - system: aarch64-darwin
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      # Configure CACHIX_CACHE and CACHIX_AUTH_TOKEN when a cache is available.
      - uses: cachix/cachix-action@v16
        if: vars.CACHIX_CACHE != '' && github.event_name != 'pull_request'
        with:
          name: ${{ vars.CACHIX_CACHE }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - run: nix build --print-build-logs
      - run: nix run . -- --version
      - run: nix run . -- extension list --query '[].name' --output tsv
      - name: Check command loading without credentials
        env:
          AZURE_EXTENSION_USE_DYNAMIC_INSTALL: 'no'
        run: |
          nix run . -- containerapp revision list --help
          nix run . -- monitor app-insights query --help
          nix run . -- graph query --help
          nix run . -- monitor log-analytics query --help
      - run: nix flake check --no-build
